name: publish-v0.92
on:
  push:
    branches: [main, 'release/v0.92']
    paths:
      - 'docs/release/v0.92-publication.json'
      - 'tools/publish_v092.py'
      - '.github/workflows/publish-v0.92.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-v0.92-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the original Actions ZIP and public source
        run: python3 tools/publish_v092.py prepare
      - name: Checkout SDK headers required by USB host tests
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Run public host regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          cmake -S tests/host -B build-host -G Ninja
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure --output-junit test-results.xml
      - name: Preserve audited release assets
        uses: actions/upload-artifact@v4
        with:
          name: v0.92-release-preparation
          path: |
            release-assets/
            build-host/test-results.xml
          retention-days: 90
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v0.92-release-preparation
          path: prepared
      - name: Locate prepared assets
        run: |
          test -d prepared/release-assets
          mv prepared/release-assets release-assets
      - name: Publish formal release and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_v092.py publish
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.92-publication-receipt
          path: release-assets/publication-audit.json
          retention-days: 90
          if-no-files-found: error
